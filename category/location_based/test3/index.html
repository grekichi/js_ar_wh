<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>my AR location demo</title>
        <!-- A-Frameの読み込み -->
        <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
        
        <!-- AR.jsの読み込み -->
        <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
        <!-- nft.jsの読み込み -->
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
        <!-- look.atの読み込み -->
        <!-- <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script> -->
        <!-- A-Frame-extrasの読み込み: animationモデル用 -->
        <!-- <script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v7.6.0/dist/aframe-extras.min.js"></script> -->
        
        <!-- <!-- AR.js A-Frame components -->
        <script src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
        <!-- <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script> -->
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script> -->

        <!-- <style>
            body {
                margin: 0;
                overflow: hidden;
            }
        </style> -->
    </head>

    <body>
        <!-- 
        This is using a simulated location. If testing on a mobile device, remove the 
        'simulateLatitude' and 'simulateLongitude' properties from 'gps-new-camera' and
        change the 'latitude' and 'longitude' properties to a location around 0.001 
        degrees from your real location.
        -->
            <!-- "sourceType: webcam; videoTexture: true;"  -->
        <a-scene
            vr-mode-ui="enabled: false"
            arjs="sourceType: webcam; videoTexture: true; gpsMinDistance: 1; debugUIEnabled: false"
        >
            <a-camera
                gps-camera
                rotation-reader
            ></a-camera>
    
            <a-assets>
                <!-- targetアニメーションモデル -->
                <a-asset-item id="model" src="../../../src/model/gltf/ufo.glb"></a-asset-item>
            </a-assets>
            <!-- UPDATEモデル -->
            <a-entity gps-entity-place="latitude: 34.686; longitude: 137.674;"></a-entity>
                <a-entity
                    gltf-model="#model"
                    scale="0.05 0.05 0.05"
                    position="0 5 -5"
                    material="side: front"
                    animation-mixer
                ></a-entity>
            <!-- test用テキスト -->
            <!-- <a-text
                look-at="[gps-camera]"
                gps-entity-place="latitude: 34.686; longitude: 137.674"
                value="東京駅付近"
                <!-- color: yellow; align: center; width: 10" -->
                scale="10 10 10"
            ></a-text> -->
        </a-scene>
    </body>
</html>
